[tox]
isolated_build = true
envlist =
	py{310,311,312}-django{42,50,52}-djangocms41-{basic,filer,anylink}
	py{310,311,312}-django{42,50,52}-djangocms41-all

[gh-actions]
python =
	3.10: py310
	3.11: py311
	3.12: py312

[testenv]
setenv = PYTHONPATH={toxinidir}
deps =
	django42: Django>=4.2,<5.0
	django50: Django>=5.0,<5.1
	django52: Django>=5.2,<5.3
	djangocms41: django-cms>=4.1,<5
	djangocms41: djangocms-versioning>=2.0
	filer: django-filer>=3.3,<4.0
	anylink: django-anylink>=3.0,<4.0
	all: django-anylink>=3.0,<4.0
	all: django-filer>=3.3,<4.0
allowlist_externals =
	poetry
	sh
skip_install = true
commands =
	poetry export --with dev --without-hashes -o {toxworkdir}/reqs.txt
	sh -c 'grep -v "^[dD]jango==" {toxworkdir}/reqs.txt | grep -v "^django-cms==" | grep -v "^django-filer==" | grep -v "^django-anylink==" | python -m pip install --no-deps -r /dev/stdin'
	basic: pytest --ignore=tests/anylink --ignore=tests/filer
	filer: pytest --ignore=tests/anylink
	anylink: pytest --ignore=tests/filer
	all: pytest --cov
	all: ruff check cms_helpers tests
	all: ruff format --check cms_helpers tests
