[tool.poetry]
name = "django-cms-helpers"
version = "3.0.0"
description = "django-cms-helpers is a collection of helpers when working with django-cms."
authors = [
	"Stephan Jaekel <steph@rdev.info>",
]
license = "MIT"
readme = "README.rst"
homepage = 'https://github.com/stephrdev/django-cms-helpers'
repository = 'https://github.com/stephrdev/django-cms-helpers'
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"License :: OSI Approved :: MIT License",
	"Environment :: Web Environment",
	"Framework :: Django",
	"Intended Audience :: Developers",
	"Operating System :: Unix",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
]
packages = [{ include = "cms_helpers" }]
include = ["LICENSE.rst"]

[tool.poetry.dependencies]
python = ">=3.10,<4"

Django = ">=4.2"
django-cms = ">=4.1,<5"
djangocms-versioning = ">=2.0"

Sphinx = {version = ">=5.1", optional = true}
django-anylink = {version = ">=3.0", optional = true}
django-filer = {version = ">=3.3", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.1"
pytest-cov = ">=3.0"
pytest-django = ">=4.5"
factory-boy = ">=3.2"
ruff = ">=0.5"
coverage = {version = ">=6.4", extras = ["toml"]}
django-anylink = ">=3.0"
django-filer = ">=3.3"

[tool.poetry.extras]
docs = ["Sphinx", "django-filer", "django-anylink"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-v --tb=short --nomigrations"
testpaths = ["cms_helpers", "tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90"]
ignore = ["E203", "E266"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
lines-after-imports = 2
known-third-party = ["django", "anylink", "filer"]

[tool.ruff.format]
quote-style = "preserve"

[tool.coverage.run]
branch = true
source = ["cms_helpers"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["raise NotImplementedError"]
